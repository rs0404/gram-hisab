<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gram Hisab · ग्राम हिसाब</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="brand" data-act="switchUser" style="cursor:pointer">
    <span class="logo logo-img" role="img" aria-label="Gram Hisab"></span>
    <div>
      <div class="appname" lang="ne">ग्राम हिसाब</div>
      <div class="sub" id="topDate"></div>
    </div>
  </div>
  <div class="topright">
    <button class="pricechip" id="priceChip" data-act="editPrice"></button>
    <button class="iconbtn" id="syncBtn" data-act="syncNow" aria-label="Sync"><span id="syncDot" class="dot off"></span></button>
    <button class="iconbtn" id="calBtn" data-act="openCalendar" aria-label="Nepali calendar (patro)"></button>
    <button class="iconbtn" data-act="go" data-view="settings" aria-label="Settings">⚙️</button>
  </div>
  <div id="secbar" class="secbar"></div>
</header>

<main id="main">
  <section id="v-kheti" class="view"></section>
  <section id="v-kwork" class="view"></section>
  <section id="v-workers" class="view"></section>
  <section id="v-kreports" class="view"></section>
  <section id="v-kmachines" class="view"></section>
  <section id="v-mill" class="view"></section>
  <section id="v-credit" class="view"></section>
  <section id="v-millreport" class="view"></section>
  <section id="v-home" class="view"></section>
  <section id="v-sell" class="view"></section>
  <section id="v-buy" class="view"></section>
  <section id="v-shop" class="view"></section>
  <section id="v-reports" class="view"></section>
  <section id="v-settings" class="view"></section>
</main>

<nav id="nav">
  <button id="micBtn" data-act="mic" class="mic" aria-label="Speak"><span class="micicon">🎤</span></button>
</nav>

<div id="voice" class="voice hidden">
  <div class="voicebox">
    <div class="pulse"><span>🎤</span></div>
    <div id="voiceState" class="vstate">Listening…</div>
    <div id="voiceText" class="vtext"></div>
    <div class="vhint" id="voiceHint">Say: “sold 2 kg from B1”</div>
    <button class="btn ghost big" data-act="cancelVoice">Cancel</button>
    <button class="btn ghost" data-act="voiceHelp" style="margin-top:10px;width:100%">📖 What can I say?</button>
  </div>
</div>

<div id="sheetWrap" class="sheetwrap hidden">
  <div class="sheetbg" data-act="closeSheet"></div>
  <div id="sheet" class="sheet"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="nepcal.js"></script>
<script src="core.js"></script>
<script src="calc.js"></script>
<script src="voice.js"></script>
<script src="parser.js"></script>
<script src="flows.js"></script>
<script src="shop.js"></script>
<script src="updater.js"></script>
<script src="migrate.js"></script>
<script src="landunits.js"></script>
<script src="kheti.js"></script>
<script src="kheti-ui.js"></script>
<script src="kheti-voice.js"></script>
<script src="machines.js"></script>
<script src="mill.js"></script>
<script src="cut.js"></script>
<script src="lists.js"></script>
<script src="credit.js"></script>
<script src="panchang.js"></script>
<script src="calendar.js"></script>
<script src="ui.js"></script>
</body>
</html>
